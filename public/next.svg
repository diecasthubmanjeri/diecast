<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Icon Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)" stroke="#1e293b" stroke-width="8" />

  <!-- Subtle Inner Ring Glow -->
  <rect x="28" y="28" width="456" height="456" rx="96" fill="none" stroke="url(#primary)" stroke-width="2" opacity="0.4" />

  <!-- Brand Typography: DIECAST -->
  <text x="256" y="125" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" letter-spacing="6" fill="#f8fafc">DIECAST</text>

  <!-- Aerodynamic Sports Car Silhouette -->
  <!-- Car Body Glow / Shadow -->
  <path d="M 100 285 C 130 225, 185 175, 260 170 C 335 165, 385 210, 420 270 L 458 295 C 475 305, 470 325, 448 325 L 64 325 C 45 325, 40 305, 60 295 Z" fill="url(#primary)" filter="url(#glow)" opacity="0.95" />

  <!-- Windshield / Windows Cutout -->
  <path d="M 165 265 C 185 220, 230 190, 275 188 C 325 186, 355 212, 385 265 C 320 268, 230 268, 165 265 Z" fill="#0b1120" />

  <!-- Racing Speed Stripe Accent -->
  <path d="M 70 340 L 442 340" stroke="url(#accent)" stroke-width="12" stroke-linecap="round" />
  <path d="M 120 358 L 392 358" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" opacity="0.75" />

  <!-- Front Headlight Beam -->
  <polygon points="425,272 475,260 472,282 420,285" fill="#fef08a" opacity="0.9" filter="url(#glow)" />

  <!-- Wheels / Rims -->
  <!-- Left Wheel -->
  <circle cx="145" cy="325" r="42" fill="#0f172a" stroke="#334155" stroke-width="8" />
  <circle cx="145" cy="325" r="28" fill="#1e293b" stroke="url(#primary)" stroke-width="4" />
  <circle cx="145" cy="325" r="10" fill="#38bdf8" />

  <!-- Right Wheel -->
  <circle cx="367" cy="325" r="42" fill="#0f172a" stroke="#334155" stroke-width="8" />
  <circle cx="367" cy="325" r="28" fill="#1e293b" stroke="url(#primary)" stroke-width="4" />
  <circle cx="367" cy="325" r="10" fill="#38bdf8" />

  <!-- Brand Typography: HUB -->
  <text x="256" y="440" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="900" letter-spacing="14" fill="url(#primary)">HUB</text>
</svg>